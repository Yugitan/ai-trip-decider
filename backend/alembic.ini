[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.14+ 用 path_separator 取代 version_path_separator（后者已弃用）
path_separator = os

# 数据库 URL 不写在这里，由 alembic/env.py 从应用配置注入：
#   优先级 ALEMBIC_DATABASE_URL 环境变量 > Settings.database_url
sqlalchemy.url =

# 说明：不使用 alembic 的 post_write_hooks 自动格式化（其 entrypoint 解析在本环境下失败），
# 生成后手动跑 `make format` 即可。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
