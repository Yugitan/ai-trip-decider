[project]
name = "tripdecider-backend"
version = "0.1.0"
description = "TripDecider — AI 旅行路线决策器后端（广州 MVP）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.0",
    "python-slugify>=8.0.4",
    "pypinyin>=0.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "respx>=0.21.1",
    "types-pyyaml>=6.0.12",
]

# 这是一个应用（不是库），不需要被打包安装：uv 只负责解析与安装依赖。
# `app` 包通过工作目录（uvicorn 以 backend/ 为 cwd 启动）与 pytest 的 pythonpath 生效。
[tool.uv]
package = false

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "T20", "PTH"]
ignore = [
    "E501",    # 行长由 formatter 处理
    "S101",    # 测试里允许 assert
    "B008",    # FastAPI 的 Depends() 默认值写法是官方模式
    "N818",    # 领域异常名（如 CostBreakerOpen）优先可读性，不强制 Error 后缀
    "RUF001",  # 允许中文全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "N802"]  # 测试函数名允许中文描述语料
"scripts/**" = [
    "T20",     # 脚本用 print 输出进度与摘要（是它的正常输出方式）
    "PTH",     # 数据脚本沿用 os.path 写法，迁移价值低
    "S310",    # 只请求固定的 Overpass/OSM 白名单地址
    "UP031",   # % 格式化在生成报告文本时更直观
    "RUF059",
]
"app/db/models.py" = ["N815"]    # 列名沿用数据库命名风格

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
# scripts/ 是显式包（有 __init__.py），tests/ 不是；不显式声明 package bases
# 时 mypy 会因为"同一目录下两种包风格"而拒绝检查。
explicit_package_bases = true
mypy_path = "."
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: 纯逻辑单元测试（无 IO、无数据库、无网络）",
    "integration: 需要真实数据库或 HTTP 层的集成测试",
    "contract: Provider 契约测试（使用录制的 fixtures）",
    "slow: 较慢的测试，默认跳过（make test-slow）",
]
filterwarnings = [
    # 第三方依赖（anyio/starlette/fastapi）的弃用告警不由我们控制，先放行；
    # 但**我们自己的代码**一旦用了弃用 API 必须让测试失败（后写的过滤器优先级更高）。
    "default::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "error::DeprecationWarning:app\\..*",
    "error::DeprecationWarning:tests\\..*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/models.py", "alembic/*"]
# ★ 必须声明 greenlet 并发 ★
# SQLAlchemy 的 async 引擎内部通过 greenlet 切换执行上下文（greenlet_spawn），
# 而 coverage 默认只跟踪 thread。缺了这一行会得到一个**系统性失真**的覆盖率：
# 所有 async 端点只统计到第一个 await 之前，await 之后的代码全部被记为"未覆盖"。
# 实测影响（2026-09-10）：app/api/v1/catalog.py 被报成 54%，实际是 98%；
# 全仓总覆盖率被低估约 5 个百分点。这会让覆盖率失去闸门意义 ——
# 真实未覆盖的分支淹没在大量假阴性里，无法分辨。
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    # 单行的协议方法体（`...` 独占一行时 coverage 会当成一条未覆盖语句）。
    # Protocol 是契约声明，不可能被"执行"，把它算进覆盖率只会制造噪声。
    "^\\s*\\.\\.\\.$",
]
