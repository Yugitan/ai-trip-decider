# 广州精选路线模板（人工整理）
#
# 用途：冷启动时直接命中 L3（热门路线库），避免每次都从零组合（PRD §15.1）。
#
# ★ 诚实性约定 ★
#   - stops 里的 name 必须是**真实存在的地点名**，建库时会去知识库里解析。
#     解析不到的站点会被如实报告（不会被悄悄删掉或替换成别的点）。
#   - 本文件**不提供**任何营业时间 / 价格 / 距离 / 时长事实。
#     路线时长与步行距离由建库脚本根据站点坐标**估算**并标记为估算值，
#     营业时间与票价一律沿用各地点的真实来源状态（大多为 unknown）。
#   - best_for / description 是编辑性描述（帮助用户选择），不是事实断言。

