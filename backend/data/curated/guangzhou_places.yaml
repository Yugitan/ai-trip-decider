# 广州知识库 —— 人工整理的地点覆盖数据（编辑性数据）
#
# ★ 本文件只做两件事，**不写任何事实性字段** ★
#   1. aliases：真实存在的别名（"小蛮腰"→广州塔），用于实体匹配与用户口语输入识别。
#      这类知识无法从 OSM 机械推导（OSM 不会告诉你"小蛮腰"就是广州塔），
#      只能人工整理，所以它有存在价值；它是"名称知识"而不是"事实断言"。
#   2. scores / category / recommended_duration_min / tags：**编辑性排序偏好**。
#      覆盖 config/seed.yaml 的规则推导值，让真正的目的地排在前面。
#      命中覆盖的地点会带 data_quality_flags=['score_curated']，与规则推导值可区分。
#
# ★ 明确不写的东西（写了就是编造）★
#   opening_hours / price_min / price_max / address / 电话 / 官网
#   —— 这些必须来自可核验来源（OSM）。本文件一个都不提供。
#
# 匹配规则：用 name 与 aliases 依次去 OSM 数据里找。
#   先精确匹配归一化名称，再用 app/domain/naming.py 的相似度（阈值 0.82）模糊匹配。
#   匹配不到的条目会在建库报告里列为 "curated_unresolved"，**不会**被凭空插入数据库。

