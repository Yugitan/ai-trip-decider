  shopping:
    label: "购物"
    icon: "🛍"
    field: null
    categories: ["shopping"]
    aliases: ["购物", "商场", "买东西", "逛街购物"]
  museum:
    label: "博物馆"
    icon: "🖼"
    field: null
    categories: ["museum"]
    aliases: ["博物馆", "展览", "美术馆", "看展"]
